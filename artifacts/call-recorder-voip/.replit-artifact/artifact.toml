kind = "mobile"
previewPath = "/"
title = "Call Recorder VoIP"
description = "A mobile VoIP calling app that automatically records both sides of in-app calls after consent and saves recordings locally on the phone for playback and export."
version = "1.0.0"
id = "artifacts/call-recorder-voip"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25596

[services.development]
run = "pnpm --filter @workspace/call-recorder-voip run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/call-recorder-voip", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/call-recorder-voip", "run", "serve" ]

[services.env]
PORT = "25596"
BASE_PATH = "/"
